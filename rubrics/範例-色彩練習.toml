# 作業評分規準（rubric）範例
# 複製一份改成自己的作業，用「記事本」編輯即可，存檔編碼選 UTF-8。
# 規則：每個檢查點要寫「看得見、能指出位置」的描述，不要寫「構圖良好」這種抽象形容詞。

title = "第三週 色彩練習"
task = "用廣告顏料畫一幅靜物，練習冷暖色對比"   # 作業說明，讓 AI 知道學生在做什麼

# 等級由好到壞排列；最後一律會自動多一個「無法判斷」
levels = ["符合", "部分符合", "不符合"]
# 各等級的分數（與 levels 一一對應）。不想算分就整行刪掉。
# 分數只顯示在老師的審核頁面與匯出的成績表，不會貼給學生。
points = [3, 2, 1]

[[criteria]]
name = "指定內容"
look_for = "畫面中是否畫出至少三種靜物（例如水果、瓶子、布）"

[[criteria]]
name = "冷暖對比"
look_for = "是否以冷色系（藍、綠、紫）為主色調，並有一處明顯的暖色（紅、橘、黃）做對比"
# 可以為這一項另外寫各等級的判斷依據（選填）。中文的等級名稱要加雙引號
level_notes = { "符合" = "冷色占畫面大半，且至少一處暖色", "部分符合" = "有冷暖色，但主色調不明顯", "不符合" = "看不出冷暖安排" }

[[criteria]]
name = "主體位置"
look_for = "主要的靜物是否放在畫面中央以外的位置（例如偏左或偏右三分之一處）"

[[criteria]]
name = "明暗表現"
look_for = "靜物是否有受光面與陰影"
ai = false   # AI 判斷明暗不可靠，交給老師；審核頁會留欄位給老師選

# ---------------------------------------------------------------- 評語風格
[feedback]
tone = "溫暖、具體，用提問引導學生自己發現，不直接給答案"
length = "優點 1 句（要說出在畫面哪裡）、引導問題 1～2 句、鼓勵 1 句，全部 120 字以內"
avoid = ["不提分數或等級", "不和其他同學比較", "不評論創意好壞", "不說「畫得不好」「錯了」"]
# 老師自己寫過的評語範本（2～3 則），AI 會模仿語氣。換成你的。
examples = [
  "右下角那顆橘子的暖色，讓整片藍色背景一下子亮了起來！如果桌布也留一小塊暖色，你覺得畫面的視線會怎麼移動？繼續保持這份大膽用色。",
  "三樣靜物都有畫到，瓶子的藍紫色很沉穩。你覺得現在畫面最先吸引你目光的是哪裡？那是你想強調的地方嗎？下次試試看讓主角更突出。",
]
# 評語最後是否加上「本評語由 AI 協助草擬，經老師審閱」
disclose_ai = true
# 照片拍的不是作品（教室、人物、網路圖片）時，不寫評語，改用這段請學生重傳（選填）
reupload = "老師在這篇貼文裡沒有看到你的作品照片。請重新上傳：正對作品拍、光線充足、讓作品佔滿畫面，老師再給你回饋！"
