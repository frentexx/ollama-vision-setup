# 作業評分規準（rubric）範例：攝影課三份作業
# 這是 TOML 格式的純文字檔：用「記事本」或作業牆管理的「評分規準」分頁編輯，存檔編碼選 UTF-8。
# 規則：文字一律加雙引號；每個檢查點要寫「看得見、能指出位置」的描述，不要寫「構圖良好」這種抽象形容詞。
#
# 作業牆的每個區段是一份作業。區段名稱裡有 [[assignments]] 的 name（例如區段「① 微距攝影」對上「微距攝影」），
# 就用「共同檢查點＋這份作業的檢查點」來評；對不上的區段只用共同檢查點。

title = "攝影課作業"
task = "用手機或相機拍攝，練習對焦、光線與構圖"   # 整體說明，讓 AI 知道學生在做什麼
# 什麼樣的照片算是作品（AI 判斷不是作品時，會改成請學生重傳）
work = "學生自己用手機或相機拍攝的照片（原始照片），不是螢幕截圖、網路下載的圖片或翻拍別人的作品"

# 等級由好到壞排列；最後一律會自動多一個「無法判斷」
levels = ["符合", "部分符合", "不符合"]
# 各等級的分數（與 levels 一一對應）。不想算分就整行刪掉。
# 分數只顯示在老師的審核頁面與匯出的成績表，不會貼給學生。
points = [3, 2, 1]

# ---------------------------------------------------------------- 共同檢查點（三份作業都看）
[[criteria]]
name = "對焦清晰"
look_for = "照片的主角是否清楚對焦，邊緣銳利，沒有因為手晃而整張模糊"

[[criteria]]
name = "曝光適當"
look_for = "畫面是否不會太暗或太亮，主角亮的地方沒有一片死白、暗的地方沒有一片死黑"

# ---------------------------------------------------------------- 各份作業
[[assignments]]
name = "微距攝影"
task = "近距離拍攝小物件、植物或昆蟲，拍出平常肉眼不容易注意到的細節"

  [[assignments.criteria]]
  name = "近距離主角"
  look_for = "主角是否是一個小東西，而且近距離拍攝，佔畫面一半以上"

  [[assignments.criteria]]
  name = "細節質感"
  look_for = "是否拍出主角表面的紋理或細節（例如葉脈、水珠、布料纖維、金屬刮痕）"
  level_notes = { "符合" = "看得到清楚的紋理或細節", "部分符合" = "有近拍但細節不清楚", "不符合" = "看不出任何細節" }

[[assignments]]
name = "人物攝影"
task = "拍一張以人物為主角的照片，表現人物的神情或動作（拍攝前先徵得對方同意）"

  [[assignments.criteria]]
  name = "人物主角"
  look_for = "畫面的主角是否是人物，而且人物在畫面中清楚、完整、容易辨認"

  [[assignments.criteria]]
  name = "背景處理"
  look_for = "背景是否簡潔，沒有雜物干擾人物（例如頭頂沒有電線桿、樹枝像是從頭上長出來）"

  [[assignments.criteria]]
  name = "神情動作"
  look_for = "是否拍到人物自然的表情，或看得出故事的動作"
  ai = false   # 神情好不好比較主觀，交給老師判斷；審核頁會留欄位給老師選

[[assignments]]
name = "風景攝影"
task = "拍一張戶外或校園的風景，練習構圖"

  [[assignments.criteria]]
  name = "水平穩定"
  look_for = "地平線、海平面或建築的水平線是否保持水平，沒有明顯歪斜"

  [[assignments.criteria]]
  name = "三分法構圖"
  look_for = "地平線或主要景物是否放在畫面約三分之一的位置，而不是剛好切在正中央"

  [[assignments.criteria]]
  name = "遠近層次"
  look_for = "畫面是否有前景、中景、遠景至少兩層，看起來有遠近的深度"

# ---------------------------------------------------------------- 評語風格
[feedback]
tone = "溫暖、具體，用提問引導學生自己發現，不直接給答案"
length = "優點 1 句（要說出在畫面哪裡）、引導問題 1～2 句、鼓勵 1 句，全部 120 字以內"
avoid = ["不提分數或等級", "不和其他同學比較", "不評論創意好壞", "不說「拍得不好」「錯了」", "不評論被拍攝者的外貌"]
# 評語第一句要肯定學生時，可以從這些角度挑（AI 判斷學生還沒做到的地方時，會改從這裡找優點）
praise_angles = ["主題明確", "拍攝角度", "光線運用", "取景用心", "等待時機的耐心", "看得出的用心"]
# 老師自己寫過的評語範本（2～3 則），AI 會模仿語氣。換成你的。
examples = [
  "葉子上那顆水珠拍得好清楚，連裡面倒映的天空都看得到！如果換個角度讓光從葉子後面透過來，你覺得葉脈會變成什麼樣子？期待你下一張微距作品。",
  "你讓同學站在走廊的窗邊，側臉的光線好柔和。看看他頭頂上方，有沒有什麼東西搶走了大家的目光？繼續用你的眼睛找好光線。",
]
# 評語最後是否加上「本評語由 AI 協助草擬，經老師審閱」
disclose_ai = true
# 照片不是作品（截圖、網路圖片、拍錯東西）時，不寫評語，改用這段請學生重傳（選填）
reupload = "老師在這篇貼文裡沒有看到這份作業的照片。請上傳你自己拍的原始照片（不要用截圖或網路圖片），老師再給你回饋！"
